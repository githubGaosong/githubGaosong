name: Build Translate online

on:
  workflow_dispatch:
  push:
    branches: ["main", "release/translate-online-final"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows x64 folder
        run: dotnet publish "Translate.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=none -p:DebugSymbols=false -p:Optimize=true -p:PublishReadyToRun=false
      - name: Verify portable application
        shell: pwsh
        run: |
          $publish = "bin/Release/net8.0-windows/win-x64/publish"
          $exe = Join-Path $publish "Translate online.exe"
          if (!(Test-Path $exe)) { throw "Translate online.exe was not produced." }
          $files = @(Get-ChildItem $publish -File -Recurse)
          if ($files.Count -lt 5) { throw "Self-contained publish output looks incomplete ($($files.Count) files)." }
          Write-Host ("Verified EXE size: {0} bytes; publish files: {1}" -f (Get-Item $exe).Length, $files.Count)
          Compress-Archive -Path "$publish/*" -DestinationPath "Translate-online-Windows-x64.zip" -Force
      - name: Upload Translate online
        uses: actions/upload-artifact@v4
        with:
          name: Translate-online-Windows-x64
          path: "Translate-online-Windows-x64.zip"
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Translate online v1.0.0
          target_commitish: main
          generate_release_notes: true
          files: "Translate-online-Windows-x64.zip"
