name: Build Translate online

on:
  workflow_dispatch:
  push:
    branches: ["main", "release/translate-online-final"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained portable single-file EXE
        run: dotnet publish "Translate.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -p:PublishReadyToRun=false
      - name: Upload Translate online
        uses: actions/upload-artifact@v4
        with:
          name: Translate-online-Windows-x64
          path: "bin/Release/net8.0-windows/win-x64/publish/Translate online.exe"
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Translate online v1.0.0
          target_commitish: main
          generate_release_notes: true
          files: "bin/Release/net8.0-windows/win-x64/publish/Translate online.exe"
